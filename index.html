<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilustração 3D do Processo de Gravação de Experimentos</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="app-header">
    <h1>Processo de Gravação de Experimentos</h1>
    <p>
      Um participante percorre um ambiente interno utilizando uma câmera egocêntrica.
      Durante a caminhada é coletada uma sequência de imagens contendo obstáculos e uma
      situação de possível colisão, posteriormente utilizada por modelos de Visão Computacional.
    </p>
  </header>

  <main class="app-main">
    <div id="scene-container" class="scene-container"></div>

    <!-- Legenda científica -->
    <aside id="legend-panel" class="floating-panel legend-panel"></aside>

    <!-- Menu de cenários de navegação -->
    <aside id="scenario-panel" class="floating-panel scenario-panel"></aside>

    <!-- Botões de visão -->
    <div class="view-buttons">
      <button id="btn-view-overview" class="view-btn">Visão geral</button>
      <button id="btn-view-egocentric" class="view-btn">Visão egocêntrica</button>
      <button id="btn-view-top" class="view-btn">Visão superior</button>
      <button id="btn-view-lateral" class="view-btn">Visão lateral</button>
    </div>

    <!-- Controles de animação -->
    <div class="animation-controls">
      <button id="btn-play" class="anim-btn">▶ Reproduzir</button>
      <button id="btn-reset" class="anim-btn">↻ Reiniciar</button>
      <input id="progress-slider" type="range" min="0" max="1000" value="0" />
      <span id="progress-label" class="progress-label">0%</span>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
